version: '3'

dotenv: ['.env']

vars:
  MIGRATION_DB_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
  DOCKER_COMPOSE_FILE: docker/docker-compose.yaml

tasks:
  up-db:
    desc: Start PostgreSQL and wait until it is healthy
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d --wait postgres

  down:
    desc: Stop the Compose stack and delete its volumes and database data
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans

  logs:
    desc: Show logs from the Compose stack
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs

  ps:
    desc: Show the status of the Compose stack
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} ps

  stop:
    desc: Stop the Compose stack without removing volumes
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} stop

  serve:
    desc: Run the HTTP server
    deps: [migrate-up-all]
    cmds:
      - go run main.go serve

  serve-in-docker:
    desc: Apply migrations and start the service in Docker
    deps: [migrate-up-all]
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} -f docker/docker-compose.service.yaml up --build notesv1

  gen-mocks:
    desc: Generate mocks
    cmds:
      - go tool mockery

  migrate-up-all:
    desc: Run all database migrations
    deps: [up-db]
    cmds:
      - migrate -path migrations -database {{.MIGRATION_DB_DSN}} up

  migrate-up:
    desc: Run database migrations
    vars:
      n: '{{.n | default "1"}}'
    cmds:
      - migrate -path migrations -database {{.MIGRATION_DB_DSN}} up {{.n}}

  migrate-down:
    desc: Rollback database migrations
    vars:
      n: '{{.n | default "1"}}'
    cmds:
      - migrate -path migrations -database {{.MIGRATION_DB_DSN}} down {{.n}}

  migrate-new:
    desc: Create a new migration file
    requires:
      vars: [name]
    cmds:
      - migrate create -ext sql -dir migrations {{.name}}

  install-migrate:
    desc: Install the migrate CLI tool
    cmds:
      - go install -tags 'sqlite postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

  tests:
    desc: Run unit tests
    cmds:
      - go test -race -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --fix ./...

  install-lint:
    desc: Install golangci-lint
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2


